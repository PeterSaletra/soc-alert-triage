[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "soc-alert-triage"
version = "0.1.0"
description = "IDS alert triage: Random Forest alert source + Llama classification head"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "scikit-learn",
    "pyarrow",
    "joblib",
]

[tool.setuptools.packages.find]
where = ["src"]
